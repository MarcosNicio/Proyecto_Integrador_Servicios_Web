spring.application.name=veterinaria
server.port=8080

# PostgreSQL (la contraseña se toma de la variable de entorno DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/veterinaria_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo define database/veterinaria_db.sql; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
