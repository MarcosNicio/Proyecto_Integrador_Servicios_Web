spring.application.name=veterinaria
server.port=8080

# PostgreSQL (la contraseña se toma de la variable de entorno DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/veterinaria_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo define database/veterinaria_db.sql; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Swagger UI / OpenAPI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# CORS: origenes del frontend (React) que pueden consumir la API, separados por coma.
#   - http://localhost:5173 -> React con Vite (puerto por defecto)
#   - http://localhost:3000 -> React con Create React App
# Al publicar el frontend, agregar aqui su URL (ej. https://veterinaria.com). No usar "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT
# Clave secreta para firmar los tokens (minimo 32 caracteres). En produccion definir
# SIEMPRE la variable de entorno JWT_SECRET; el valor por defecto es solo para desarrollo.
app.jwt.secret=${JWT_SECRET:dev-clave-secreta-solo-para-desarrollo-local-cambiar-en-produccion}
# Duracion del token en milisegundos (86400000 = 24 horas)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
